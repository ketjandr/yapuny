[project]
name = "yapuny"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "torch",
    "numpy",
    "tokenizers",
]

[project.optional-dependencies]
gpu = [
    "triton>=3.7",
]
dev = [
    "pytest",
    "pytest-benchmark",
]

[tool.setuptools]
packages = ["model", "kernels", "data", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
# E/F = pyflakes + pycodestyle basics
# I   = isort (import sorting)
# W   = warnings
# UP  = pyupgrade (modern Python idioms)

[tool.ruff.format]
quote-style = "double"
